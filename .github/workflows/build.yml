name: Build APk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project and copy app code
        run: |
          flutter create --org com.mangalmurti --project-name mangalmurti_traders --platforms android app_build
          cp pubspec.yaml app_build/pubspec.yaml
          rm -rf app_build/lib app_build/test
          cp -r lib app_build/lib

      - name: Patch AndroidManifest (SMS permission, app name)
        run: |
          M=app_build/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.SEND_SMS"/>\n    <queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="sms"/></intent></queries>\n    <application|' $M
          sed -i 's|android:label="[^"]*"|android:label="Mangalmurti Traders"|' $M
          cat $M

      - name: Build release APK
        working-directory: app_build
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mangalmurti-traders-apk
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
